# PV System Configuration
# Panel entries carry manufacturer datasheet ground truth ONLY (nameplate pdc0,
# datasheet gamma). Empirical corrections (soiling, shading, drift) live in the
# shading-correction layer — never here.
# Full datasheet values and sources: Documents/swiss-solar-forecast-fsd.md, Appendix A.

meteoswiss:
  stac_api_url: "https://data.geo.admin.ch/api/stac/v1"
  icon_collection: "ch.meteoschweiz.ogd-forecasting-icon-ch2"

panels:
  - id: "AXITEC455"
    model: "AXITEC AC-455MH/144V (AXIpremium XL HC)"
    pdc0: 455
    gamma_pdc: -0.0035

  - id: "LONGI350"
    model: "LONGi LR4-60HPB-350M (Hi-MO 4m)"
    pdc0: 350
    gamma_pdc: -0.0037

  - id: "MB385"
    model: "Meyer Burger White 385 (HJT)"
    pdc0: 385
    gamma_pdc: -0.00259

plants:
  - name: "House"
    location:
      latitude: 47.475053232432145
      longitude: 7.767335653734485
      altitude: 330
      timezone: "Europe/Zurich"
    inverters:
      - name: "EastWest"        # Huawei 10 kW hybrid; East on PV1, West on PV2
        max_power: 10000
        efficiency: 0.98
        strings:
          - name: "East"
            azimuth: 103.3
            tilt: 15
            panel: "AXITEC455"
            count: 8
          - name: "West"
            azimuth: 283.3
            tilt: 15
            panel: "AXITEC455"
            count: 9

      - name: "South"           # Enphase microinverters, one per panel, 300 W AC each
        max_power: 1500         # 5 micros x 300 W (aggregate; longterm KPI only)
        micro_ac_cap: 308       # per-panel AC clip — measured ~308 W/panel ceiling
        efficiency: 0.98
        strings:
          - name: "SouthFront"
            azimuth: 193.3
            tilt: 70
            panel: "LONGI350"
            count: 3
          - name: "SouthBack"   # adjustable mount — tilt reflects the current setting
            azimuth: 193.3
            tilt: 30
            panel: "LONGI350"
            count: 1
          - name: "SouthBackMB" # adjustable mount — tilt reflects the current setting
            azimuth: 193.3
            tilt: 30
            panel: "MB385"
            count: 1
