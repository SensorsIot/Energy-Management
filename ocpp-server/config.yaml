name: "OCPP Server"
version: "0.9.47"
slug: "ocpp-server"
description: "OCPP 1.6j server for EV wallbox control via HA entities"
url: "https://github.com/SensorsIot/Energy-Management"
arch:
  - aarch64
  - amd64
  - armv7
init: false

startup: services
boot: auto
timeout: 120

# WebSocket port for OCPP connection from wallbox
ports:
  8887/tcp: 8887
ports_description:
  8887/tcp: "OCPP WebSocket server"

# Home Assistant API for publishing entities
homeassistant_api: true

map:
  - addon_config:rw

options:
  wallbox_id: "AcTec001"
  ws_port: 8887
  min_current_a: 6
  max_current_a: 16
  phase_switch_entity: "switch.earu_breaker_wallbox_phase_switch"
  mqtt_host: "192.168.0.203"
  mqtt_port: 1883
  mqtt_topic: "wallbox"
  wallbox_type: "three_phase"
  power_update_interval_s: 60
  current_sensor_entity: "sensor.earu_breaker_bl0942_current"
  cloud_charging_entity: "sensor.smart_charging_status_raw_value"

schema:
  wallbox_id: str
  ws_port: int
  min_current_a: int
  max_current_a: int
  phase_switch_entity: "str?"
  mqtt_host: str?
  mqtt_port: int?
  mqtt_topic: str?
  wallbox_type: "list(universal|external_breaker|three_phase)"
  power_update_interval_s: "int?"
  current_sensor_entity: "str?"
  cloud_charging_entity: "str?"
